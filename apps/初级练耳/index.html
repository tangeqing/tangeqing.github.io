<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="面向零基础学习者的离线旋律听辨训练工具">
  <title>旋律摸音训练器 · Melody Finder</title>
  <style>
    :root{--bg:#f4f6f3;--paper:#fff;--ink:#1d2a25;--muted:#65736d;--line:#dfe6e1;--brand:#326b58;--brand2:#e4f0eb;--accent:#d8864b;--good:#247153;--bad:#a64e46;--shadow:0 18px 48px rgba(35,55,46,.09);--radius:22px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,#e8f1eb 0,transparent 28rem),var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","PingFang SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.5}
    button,input,select{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}
    .app{width:min(1100px,calc(100% - 32px));margin:auto;min-height:100vh;padding-bottom:48px}
    header{height:84px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:42px;height:42px;border-radius:14px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 8px 18px rgba(29,42,37,.18)}.brand-name{font-weight:800;letter-spacing:.02em}.brand-sub{font-size:12px;color:var(--muted)}.top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .btn{min-height:44px;padding:10px 18px;border-radius:13px;background:#eef1ef;color:var(--ink);font-weight:700;transition:.18s transform,.18s background,.18s box-shadow}.btn:hover{background:#e4e9e6}.btn:active{transform:translateY(1px)}.btn:focus-visible,.mode-card:focus-visible,.key:focus-visible,.fret:focus-visible{outline:3px solid rgba(50,107,88,.28);outline-offset:3px}.btn.primary{background:var(--brand);color:#fff;box-shadow:0 8px 18px rgba(50,107,88,.18)}.btn.primary:hover{background:#285d4b}.btn.ghost{background:transparent;border:1px solid var(--line)}.btn.danger{color:var(--bad)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.icon-btn{padding:9px 12px}
    main{animation:fade .25s ease}.hero{padding:72px 0 42px;max-width:760px}.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.16em;color:var(--brand);font-weight:800}.hero h1{font-size:clamp(42px,7vw,78px);line-height:1.04;letter-spacing:-.055em;margin:14px 0 18px}.hero p{color:var(--muted);font-size:18px;margin:0;max-width:580px}
    .mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.mode-card{position:relative;text-align:left;background:var(--paper);border:1px solid rgba(29,42,37,.06);border-radius:var(--radius);padding:28px;min-height:260px;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:.22s transform,.22s box-shadow}.mode-card:hover{transform:translateY(-4px);box-shadow:0 24px 56px rgba(35,55,46,.13)}.mode-num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--brand2);color:var(--brand);font-weight:900}.mode-card h2{font-size:24px;margin:24px 0 8px}.mode-card p{color:var(--muted);margin:0 0 28px}.card-go{margin-top:auto;color:var(--brand);font-weight:800}.home-note{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px;margin-top:24px}
    .intro{max-width:700px;margin:55px auto;background:var(--paper);padding:44px;border-radius:28px;box-shadow:var(--shadow);text-align:center}.intro-icon{width:72px;height:72px;border-radius:24px;margin:auto;display:grid;place-items:center;background:var(--brand2);font-size:34px}.intro h1{font-size:34px;margin:22px 0 10px}.intro p{color:var(--muted);font-size:17px}.setting-summary{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:24px 0 30px}.pill{padding:7px 12px;border-radius:999px;background:#f0f3f1;color:#53625b;font-size:13px;font-weight:700}.intro-actions{display:flex;justify-content:center;gap:10px}
    .train-head{background:var(--paper);padding:18px 22px;border-radius:18px;margin:18px 0 14px;box-shadow:0 8px 24px rgba(35,55,46,.06)}.progress-row{display:flex;align-items:center;justify-content:space-between;gap:16px}.progress-label{font-weight:800}.mode-label{color:var(--muted);font-size:13px}.progress-track{height:7px;background:#e7ece9;border-radius:99px;margin-top:12px;overflow:hidden}.progress-fill{height:100%;background:var(--brand);width:0;transition:width .35s ease;border-radius:99px}
    .question-card{background:var(--paper);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}.question-top{text-align:center}.question-top h1{font-size:27px;margin:0 0 6px}.question-top p{color:var(--muted);margin:0}.play-row{display:flex;justify-content:center;gap:10px;margin:22px 0}.sound-btn{min-width:170px}.sound-wave{display:inline-block;margin-right:8px}.is-playing .sound-wave{animation:pulse .55s ease infinite alternate}
    .direction-actions{display:flex;justify-content:center;gap:12px;margin:28px auto 14px}.direction-btn{width:190px;padding:22px 12px;background:#f2f5f3;border:2px solid transparent;border-radius:17px;font-weight:800;font-size:16px}.direction-btn:hover{border-color:#b9cec4}.direction-btn span{display:block;font-size:28px;color:var(--brand);margin-bottom:4px}
    .feedback{min-height:58px;margin:18px auto 6px;max-width:680px;padding:14px 18px;border-radius:14px;background:#f3f5f4;color:var(--muted);text-align:center;font-weight:700;display:flex;align-items:center;justify-content:center}.feedback.good{background:#e5f3ed;color:var(--good);animation:pop .3s ease}.feedback.bad{background:#f8eae8;color:var(--bad);animation:shake .3s ease}.feedback.info{background:#eef2f0;color:#506159}.question-actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:16px}
    .visual-direction{height:92px;max-width:280px;margin:12px auto;display:flex;justify-content:center;align-items:center;gap:72px;position:relative}.visual-direction:before{content:"";position:absolute;width:150px;height:1px;background:var(--line);transform:rotate(var(--tilt,0deg))}.pitch-dot{width:18px;height:18px;border-radius:50%;background:var(--brand);z-index:1;box-shadow:0 0 0 7px var(--brand2)}.pitch-dot.second{transform:translateY(var(--offset,0px))}
    .melody-slots{display:flex;align-items:center;justify-content:center;gap:15px;margin:24px 0 12px}.note-slot{width:54px;height:54px;border-radius:50%;border:2px dashed #becbc5;display:grid;place-items:center;color:#91a098;font-weight:800}.note-slot.filled{background:var(--brand2);border-style:solid;border-color:#8cb4a4;color:var(--brand)}.note-slot.wrong{background:#f8eae8;border-color:#d8958e;color:var(--bad)}.note-slot.right{background:#e3f3eb;border-color:#78aa96;color:var(--good)}.slot-caption{text-align:center;color:var(--muted);font-size:13px}.compare-row{display:flex;justify-content:center;gap:8px;margin:10px 0}.compare-token{padding:6px 11px;border-radius:99px;background:#f1f3f2;font-size:13px;font-weight:700}
    .instrument-wrap{margin-top:26px;padding-top:23px;border-top:1px solid var(--line)}.instrument-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.instrument-head strong{font-size:16px}.instrument-help{font-size:13px;color:var(--muted)}
    .piano-scroll{overflow-x:auto;padding:8px 3px 15px}.piano{width:480px;height:240px;position:relative;margin:auto;display:flex;user-select:none}.white-key{position:relative;width:60px;height:230px;background:linear-gradient(#fff,#f8f8f4);border:1px solid #9ca7a1;border-left:0;border-radius:0 0 9px 9px;z-index:1;color:var(--muted);display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px}.white-key:first-child{border-left:1px solid #9ca7a1}.black-key{position:absolute;width:38px;height:142px;background:linear-gradient(145deg,#26322d,#0f1512);border-radius:0 0 7px 7px;z-index:2;color:#fff;align-items:flex-end;justify-content:center;padding-bottom:10px;box-shadow:0 6px 8px rgba(0,0,0,.22)}.key{transition:.09s transform,.12s background}.key:hover{filter:brightness(.97)}.key.pressed{transform:translateY(3px);filter:brightness(.9)}.key.hint{background:#e1b36f!important;box-shadow:inset 0 0 0 4px #ca8243}.key.selected{background:#d8e9e1!important}.key.correct{background:#8fc4ad!important;box-shadow:inset 0 0 0 4px #4b8a70}.key.wrong-key{background:#dca39d!important}.note-name{font-size:12px;font-weight:800}.black-key .note-name{font-size:10px}.keyboard-tip{text-align:center;color:var(--muted);font-size:12px;margin-top:-5px}
    .fretboard-wrap{overflow-x:auto;padding:6px 0 14px}.fretboard{min-width:640px;background:linear-gradient(#8c603f,#71472e);border-radius:16px;padding:28px 22px 22px;position:relative;box-shadow:inset 0 0 18px rgba(42,20,8,.25)}.string-line{height:4px;background:linear-gradient(#f2f0e8,#9b9a91,#f9f7ef);position:absolute;left:22px;right:22px;top:54px;box-shadow:0 2px 2px rgba(0,0,0,.25)}.frets{display:grid;grid-template-columns:.72fr repeat(var(--frets),1fr);position:relative}.fret{height:86px;border-right:4px solid rgba(222,217,197,.78);background:transparent;color:#fff;position:relative}.fret:first-child{border-left:0}.fret:hover{background:rgba(255,255,255,.09)}.fret:after{content:"";width:21px;height:21px;border-radius:50%;background:transparent;position:absolute;top:17px;left:50%;transform:translate(-50%,-50%);transition:.15s}.fret.pressed:after,.fret.selected:after{background:#efc675;box-shadow:0 2px 8px #44210f}.fret.correct:after,.fret.hint:after{background:#9ad2b8;box-shadow:0 0 0 5px rgba(154,210,184,.26)}.fret.wrong-key:after{background:#e49a91}.fret-label{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);font-size:12px;color:#f1dfd2;white-space:nowrap}
    .results{max-width:820px;margin:30px auto}.result-hero{text-align:center;background:var(--paper);padding:38px;border-radius:26px;box-shadow:var(--shadow)}.score-ring{width:132px;height:132px;border-radius:50%;margin:5px auto 18px;display:grid;place-items:center;background:conic-gradient(var(--brand) var(--score),#e5ebe7 0);position:relative}.score-ring:before{content:"";position:absolute;inset:10px;background:#fff;border-radius:50%}.score-ring strong{z-index:1;font-size:32px}.result-hero h1{margin:0 0 6px}.result-hero p{color:var(--muted);margin:0}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.stat{background:var(--paper);border-radius:17px;padding:18px}.stat small{display:block;color:var(--muted);margin-bottom:5px}.stat strong{font-size:24px}.result-actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:20px}
    .empty{text-align:center;color:var(--muted);padding:54px 12px}.history{max-width:900px;margin:28px auto}.page-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:32px 0 18px}.page-title h1{margin:0;font-size:36px}.page-title p{margin:5px 0 0;color:var(--muted)}.history-list{display:grid;gap:10px}.history-item{display:grid;grid-template-columns:1.3fr 1fr .8fr .7fr .7fr .8fr;align-items:center;gap:10px;background:var(--paper);padding:17px 20px;border-radius:15px}.history-item.header{background:transparent;color:var(--muted);font-size:12px;padding-block:4px}.history-item strong{color:var(--brand)}
    .modal-backdrop{position:fixed;inset:0;background:rgba(16,27,22,.5);backdrop-filter:blur(4px);display:grid;place-items:center;padding:18px;z-index:20}.modal{background:var(--paper);border-radius:24px;width:min(620px,100%);max-height:calc(100vh - 36px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.25);animation:pop .2s ease}.modal-head{position:sticky;top:0;background:rgba(255,255,255,.96);padding:22px 24px 15px;display:flex;justify-content:space-between;align-items:center;z-index:1;border-bottom:1px solid var(--line)}.modal-head h2{margin:0}.modal-body{padding:20px 24px 26px}.setting-group{margin-bottom:23px}.setting-group>label,.setting-title{display:block;font-size:14px;font-weight:800;margin-bottom:9px}.segmented{display:flex;gap:7px;flex-wrap:wrap}.segmented label{position:relative}.segmented input{position:absolute;opacity:0;pointer-events:none}.segmented span{display:block;padding:9px 14px;background:#f0f3f1;border:2px solid transparent;border-radius:11px;font-size:14px;cursor:pointer}.segmented input:checked+span{border-color:var(--brand);background:var(--brand2);color:var(--brand);font-weight:800}.segmented input:focus-visible+span{outline:3px solid rgba(50,107,88,.25)}.range-row{display:flex;align-items:center;gap:12px}.range-row input{flex:1;accent-color:var(--brand)}.notice{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 17px;border-radius:11px;z-index:50;box-shadow:var(--shadow);font-size:13px}
    @keyframes fade{from{opacity:0;transform:translateY(5px)}}@keyframes pop{50%{transform:scale(1.02)}}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}@keyframes pulse{to{opacity:.35}}
    @media(max-width:780px){.app{width:min(100% - 20px,1100px)}header{height:auto;padding:16px 0;align-items:flex-start}.brand-sub{display:none}.top-actions .btn{font-size:0;padding:10px 12px}.top-actions .btn:before{font-size:18px}.top-actions [data-action="home"]::before{content:"⌂"}.top-actions [data-action="history"]::before{content:"◷"}.top-actions [data-action="settings"]::before{content:"⚙"}.hero{padding:42px 4px 30px}.mode-grid{grid-template-columns:1fr}.mode-card{min-height:220px}.question-card{padding:22px 14px}.direction-actions{flex-direction:column}.direction-btn{width:100%;padding:14px}.direction-btn span{display:inline;margin-right:8px}.stat-grid{grid-template-columns:repeat(2,1fr)}.history-item{grid-template-columns:1fr 1fr}.history-item.header{display:none}.history-item span:nth-child(n+5){display:none}.intro{padding:30px 20px;margin:28px auto}.instrument-head{align-items:flex-start;flex-direction:column}.page-title h1{font-size:30px}}
    @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand"><div class="brand-mark" aria-hidden="true">♪</div><div><div class="brand-name">旋律摸音训练器</div><div class="brand-sub">Melody Finder · 听一遍，找到它，弹出来</div></div></div>
      <nav class="top-actions" aria-label="主要导航">
        <button class="btn ghost hidden" data-action="home">返回首页</button>
        <button class="btn ghost" data-action="history">训练记录</button>
        <button class="btn ghost" data-action="settings">设置</button>
      </nav>
    </header>
    <main id="main"></main>
  </div>
  <div id="modalRoot"></div><div id="notice" class="notice hidden" role="status"></div>
  <script>
  (()=>{'use strict';
    const STORAGE={settings:'melodyFinder.settings.v1',history:'melodyFinder.history.v1'};
    const DEFAULTS={instrument:'piano',questionCount:10,playbackSpeed:'normal',hintEnabled:true,difficulty:1,octaveRange:1,autoNext:false,showNoteNames:false,volume:.7,melodyLength:2,guitarString:2,guitarMaxFret:5};
    const DIFFICULTIES={1:{name:'入门',pianoNotes:[60,62]},2:{name:'基础',pianoNotes:[60,62,64]},3:{name:'进阶',pianoNotes:[60,62,64,67,69]}};
    const OPEN_STRINGS={1:64,2:59,3:55};
    const MODE_INFO={singleMatch:{name:'找相同的音',desc:'听一个音，在乐器上找到相同的声音。',icon:'◎'},pitchDirection:{name:'判断高低',desc:'听两个音，判断第二个音是更高、更低还是相同。',icon:'↕'},melodyRepeat:{name:'复现短旋律',desc:'听一段由 2～3 个音组成的旋律，并在乐器上弹出来。',icon:'♫'}};
    const NOTE_NAMES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
    const el={main:document.querySelector('#main'),modal:document.querySelector('#modalRoot'),notice:document.querySelector('#notice'),homeBtn:document.querySelector('[data-action="home"]')};
    let settings=load(STORAGE.settings,DEFAULTS),history=load(STORAGE.history,[]),audioCtx=null,master=null,compressor=null,hammerBuffer=null,activeNodes=[],playToken=0,noticeTimer;
    let state={view:'home',mode:null,totalQuestions:0,currentQuestionIndex:0,targetNotes:[],userNotes:[],attempts:0,replayCount:0,startTime:0,status:'idle',usedAnswerReveal:false,previousTarget:'',questionResults:[],totalAttempts:0,totalReplays:0,directionWrong:0,started:false,playing:false,lastInput:null,comparison:[]};

    function load(key,fallback){try{const x=localStorage.getItem(key);if(!x)return Array.isArray(fallback)?[]:{...fallback};const parsed=JSON.parse(x);return Array.isArray(fallback)?(Array.isArray(parsed)?parsed:[]):{...fallback,...parsed}}catch(e){return Array.isArray(fallback)?[]:{...fallback}}}
    function save(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch(e){showNotice('当前浏览器无法保存训练记录，但不影响本次训练。');return false}}
    function showNotice(text){el.notice.textContent=text;el.notice.classList.remove('hidden');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>el.notice.classList.add('hidden'),2800)}
    function noteName(m){return NOTE_NAMES[m%12]+(Math.floor(m/12)-1)}
    function modeName(){return MODE_INFO[state.mode]?.name||''}
    function difficultyName(){return DIFFICULTIES[settings.difficulty].name}
    function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function setView(view){state.view=view;el.homeBtn.classList.toggle('hidden',view==='home');render()}

    function render(){stopPlayback();if(state.view==='home')renderHome();else if(state.view==='intro')renderIntro();else if(state.view==='training')renderTraining();else if(state.view==='results')renderResults();else if(state.view==='history')renderHistory();}
    function renderHome(){el.main.innerHTML=`<section class="hero"><div class="eyebrow">从听见，到弹出来</div><h1>不用认音名，<br>先听懂声音。</h1><p>从一个音开始，在钢琴或吉他上慢慢摸索。每一次偏高、偏低，都是耳朵正在找到方向。</p></section><section class="mode-grid" aria-label="训练模式">${Object.entries(MODE_INFO).map(([id,m],i)=>`<button class="mode-card" data-mode="${id}"><span class="mode-num">0${i+1}</span><h2>${m.name}</h2><p>${m.desc}</p><span class="card-go">开始训练&nbsp; →</span></button>`).join('')}</section><div class="home-note"><span>◉</span><span>所有声音实时生成，训练记录只保存在你的浏览器中。</span></div>`;el.main.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>chooseMode(b.dataset.mode))}
    function chooseMode(mode){state.mode=mode;state.started=false;setView('intro')}
    function renderIntro(){const m=MODE_INFO[state.mode];el.main.innerHTML=`<section class="intro"><div class="intro-icon">${m.icon}</div><h1>${m.name}</h1><p>${m.desc}<br>${state.mode==='melodyRepeat'?'第一个音会先给出，跟着耳朵找到后面的音。':'可以不限次数重听，慢慢比较。'}</p><div class="setting-summary"><span class="pill">${settings.instrument==='piano'?'钢琴':'第 '+settings.guitarString+' 弦吉他'}</span><span class="pill">${settings.octaveRange} 个八度</span><span class="pill">${settings.questionCount} 题</span><span class="pill">${difficultyName()}</span><span class="pill">${settings.playbackSpeed==='slow'?'慢速':'正常速度'}</span>${state.mode==='melodyRepeat'?`<span class="pill">${settings.melodyLength} 个音</span>`:''}</div><div class="intro-actions"><button class="btn ghost" data-back>返回</button><button class="btn primary" data-begin>启用声音并开始</button></div></section>`;el.main.querySelector('[data-back]').onclick=()=>setView('home');el.main.querySelector('[data-begin]').onclick=startTraining}

    async function initAudio(){if(!window.AudioContext&&!window.webkitAudioContext)throw new Error('unsupported');if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();compressor=audioCtx.createDynamicsCompressor();compressor.threshold.value=-20;compressor.knee.value=18;compressor.ratio.value=3;compressor.attack.value=.004;compressor.release.value=.22;master.gain.value=settings.volume;master.connect(compressor);compressor.connect(audioCtx.destination);hammerBuffer=audioCtx.createBuffer(1,Math.ceil(audioCtx.sampleRate*.035),audioCtx.sampleRate);const data=hammerBuffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,3)}if(audioCtx.state==='suspended')await audioCtx.resume()}
    async function startTraining(){try{await initAudio()}catch(e){showNotice('当前浏览器不支持所需的音频功能，请使用最新版 Chrome、Edge 或 Safari。');return}state={...state,view:'training',totalQuestions:+settings.questionCount,currentQuestionIndex:0,questionResults:[],totalAttempts:0,totalReplays:0,previousTarget:'',started:true};el.homeBtn.classList.remove('hidden');createNewQuestion()}
    function midiToFrequency(m){return 440*Math.pow(2,(m-69)/12)}
    function stopPlayback(){playToken++;activeNodes.forEach(n=>{try{n.stop()}catch(e){}});activeNodes=[];state.playing=false}
    function soundNote(midi,duration=.5,when=null,token=playToken){if(!audioCtx||token!==playToken)return;const t=when??audioCtx.currentTime,base=midiToFrequency(midi),tail=Math.max(.72,duration*1.65);[[1,1,0],[2,.32,-1.4],[3,.14,1.1],[4,.065,-.7],[5,.028,.6]].forEach(([ratio,level,detune])=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=base*ratio;osc.detune.value=detune;const peak=.19*level*Math.min(1.08,Math.pow(440/base,.08));gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(Math.max(.0001,peak),t+.008+ratio*.0015);gain.gain.exponentialRampToValueAtTime(Math.max(.0001,peak*.34),t+.12);gain.gain.exponentialRampToValueAtTime(.0001,t+tail/(1+(ratio-1)*.16));osc.connect(gain);gain.connect(master);osc.start(t);osc.stop(t+tail+.04);activeNodes.push(osc)});if(hammerBuffer){const hit=audioCtx.createBufferSource(),filter=audioCtx.createBiquadFilter(),gain=audioCtx.createGain();hit.buffer=hammerBuffer;filter.type='bandpass';filter.frequency.value=Math.min(5200,1500+base*3.5);filter.Q.value=.65;gain.gain.setValueAtTime(.014,t);gain.gain.exponentialRampToValueAtTime(.0001,t+.035);hit.connect(filter);filter.connect(gain);gain.connect(master);hit.start(t);hit.stop(t+.04);activeNodes.push(hit)}}
    async function playSequence(notes,isReplay=false){if(state.playing)return;await initAudio();stopPlayback();const token=playToken;state.playing=true;if(isReplay){state.replayCount++;state.totalReplays++;updateLiveMeta()}const duration=settings.playbackSpeed==='slow'?.8:.5,gap=.22;notes.forEach((n,i)=>soundNote(n,duration,audioCtx.currentTime+.06+i*(duration+gap),token));updatePlayButtons(true);setTimeout(()=>{if(token===playToken){state.playing=false;activeNodes=[];updatePlayButtons(false)}},(notes.length*(duration+gap)+.1)*1000)}
    function playInstrumentNote(midi){initAudio().then(()=>{const token=playToken;soundNote(midi,.68,audioCtx.currentTime,token)}).catch(()=>{})}
    function updatePlayButtons(on){document.querySelectorAll('[data-play-question]').forEach(b=>{b.disabled=on;b.classList.toggle('is-playing',on);b.innerHTML=on?'<span class="sound-wave">)))</span> 正在播放':'<span class="sound-wave">◖</span> 再听一次'});document.querySelectorAll('[data-play-answer]').forEach(b=>b.disabled=on)}
    function updateLiveMeta(){const m=document.querySelector('[data-live-meta]');if(m)m.textContent=`尝试 ${state.attempts} 次 · 重播 ${state.replayCount} 次`}

    function getAvailableNotes(){const octaves=+settings.octaveRange||1;if(settings.instrument==='piano'){const base=DIFFICULTIES[settings.difficulty].pianoNotes,notes=[];for(let o=0;o<octaves;o++)base.forEach(n=>notes.push(n+o*12));if(octaves===2)notes.push(84);return[...new Set(notes)].sort((a,b)=>a-b)}const open=OPEN_STRINGS[settings.guitarString],patterns={1:[0,2],2:[0,2,4],3:[0,2,4,5,7]},notes=[];for(let o=0;o<octaves;o++)patterns[settings.difficulty].forEach(f=>notes.push(open+f+o*12));if(octaves===2)notes.push(open+24);return[...new Set(notes)].sort((a,b)=>a-b)}
    function sameTarget(a,b){return a.join(',')===b}
    function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
    function createNewQuestion(){stopPlayback();state.currentQuestionIndex++;state.userNotes=[];state.attempts=0;state.replayCount=0;state.directionWrong=0;state.usedAnswerReveal=false;state.status='listening';state.startTime=Date.now();state.lastInput=null;state.comparison=[];let target,tries=0;do{target=generateTarget()}while(sameTarget(target,state.previousTarget)&&++tries<12);state.targetNotes=target;state.previousTarget=target.join(',');if(state.mode==='melodyRepeat')state.userNotes=[target[0]];renderTraining();setTimeout(()=>playSequence(target,false),180)}
    function generateTarget(){const notes=getAvailableNotes();if(state.mode==='singleMatch')return[pick(notes)];if(state.mode==='pitchDirection'){let kind;const r=Math.random();kind=r<.4?'higher':r<.8?'lower':'same';if(state.previousTarget){const prev=directionOf(state.previousTarget.split(',').map(Number));if(prev===kind&&Math.random()<.7)kind=pick(['higher','lower','same'].filter(x=>x!==prev))}if(kind==='same'){const n=pick(notes);return[n,n]}const sorted=notes.slice().sort((a,b)=>a-b),lo=pick(sorted.slice(0,-1)),hi=pick(sorted.filter(n=>n>lo));return kind==='higher'?[lo,hi]:[hi,lo]}
      const len=+settings.melodyLength;for(let tries=0;tries<30;tries++){let first=Math.random()<.5?notes[0]:pick(notes),seq=[first];while(seq.length<len){const last=seq[seq.length-1],near=notes.filter(n=>Math.abs(n-last)<=5),idx=near.indexOf(last),options=[near[idx-1],near[idx],near[idx+1]].filter(n=>n!=null);seq.push(pick(options.length?options:[last]))}if(len===2||new Set(seq).size>1)return seq}return len===2?[notes[0],notes[1]||notes[0]]:[notes[0],notes[1]||notes[0],notes[0]]}
    function directionOf(notes){return notes[1]>notes[0]?'higher':notes[1]<notes[0]?'lower':'same'}

    function renderTraining(){const pct=((state.currentQuestionIndex-1)/state.totalQuestions)*100;let prompt=state.mode==='singleMatch'?'请听目标音，然后在乐器上找到相同的声音。':state.mode==='pitchDirection'?'第二个音相对于第一个音，是更高、更低，还是相同？':`第一个音已经给出，请找到后面的 ${settings.melodyLength-1} 个音。`;
      el.main.innerHTML=`<section class="train-head"><div class="progress-row"><div><div class="progress-label">第 ${state.currentQuestionIndex} / ${state.totalQuestions} 题</div><div class="mode-label">${modeName()} · ${difficultyName()}</div></div><div class="mode-label" data-live-meta>尝试 ${state.attempts} 次 · 重播 ${state.replayCount} 次</div></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div></section><section class="question-card"><div class="question-top"><h1>${state.mode==='singleMatch'?'找到它':state.mode==='pitchDirection'?'听音高方向':'弹出这段旋律'}</h1><p>${prompt}</p></div><div class="play-row"><button class="btn primary sound-btn" data-play-question><span class="sound-wave">◖</span> 再听一次</button></div><div id="answerArea">${renderAnswerArea()}</div><div id="feedback" class="feedback info">先专心听一遍，再开始作答。</div><div id="questionActions" class="question-actions">${renderQuestionActions()}</div>${state.mode==='pitchDirection'?'':`<div class="instrument-wrap">${renderInstrument()}</div>`}</section>`;
      bindTraining();if(state.mode==='melodyRepeat')markInstrument(state.targetNotes[0],'hint')}
    function renderAnswerArea(){if(state.mode==='singleMatch')return'';if(state.mode==='pitchDirection')return`<div class="direction-actions"><button class="direction-btn" data-direction="higher"><span>↑</span>第二个音更高</button><button class="direction-btn" data-direction="lower"><span>↓</span>第二个音更低</button><button class="direction-btn" data-direction="same"><span>＝</span>两个音相同</button></div><div id="directionVisual"></div>`;return`<div class="melody-slots">${Array.from({length:+settings.melodyLength},(_,i)=>{const n=state.userNotes[i];return`<div class="note-slot ${n!=null?'filled':''}" data-slot="${i}">${i===0?'♪':n!=null?i+1:'○'}</div>`}).join('')}</div><div class="slot-caption">${state.userNotes.length<settings.melodyLength?'点击乐器，依次填入音符':'已填满，可以播放或提交答案'}</div>`}
    function renderQuestionActions(){if(state.mode==='singleMatch')return`<button class="btn ghost" data-reveal>显示答案</button>`;if(state.mode==='pitchDirection')return`<button class="btn ghost hidden" data-reveal>查看答案</button>`;return`<button class="btn ghost" data-delete ${state.userNotes.length<=1?'disabled':''}>删除上一个</button><button class="btn ghost" data-clear ${state.userNotes.length<=1?'disabled':''}>清空重来</button><button class="btn ghost" data-play-answer ${state.userNotes.length<2?'disabled':''}>播放我的答案</button><button class="btn primary" data-submit ${state.userNotes.length<settings.melodyLength?'disabled':''}>提交答案</button>`}
    function renderInstrument(){return`<div class="instrument-head"><div><strong>${settings.instrument==='piano'?'虚拟钢琴':'单弦吉他 · 第 '+settings.guitarString+' 弦'}</strong><div class="instrument-help">${settings.instrument==='piano'?'不用看音名，跟着声音寻找。':'向右音更高，向左音更低。'}</div></div><span class="pill">${settings.showNoteNames?'音名已显示':'音名已隐藏'}</span></div>${settings.instrument==='piano'?renderPiano():renderGuitar()}`}
    function renderPiano(){const end=60+(+settings.octaveRange||1)*12,whites=[],blacks=[];for(let m=60;m<=end;m++){if([0,2,4,5,7,9,11].includes(m%12))whites.push(m);else if(m<end)blacks.push(m)}const width=whites.length*60;return`<div class="piano-scroll"><div class="piano" style="width:${width}px" aria-label="C4 到 ${noteName(end)} 虚拟钢琴">${whites.map(m=>`<button class="white-key key" data-midi="${m}" aria-label="琴键 ${noteName(m)}">${settings.showNoteNames?`<span class="note-name">${noteName(m)}</span>`:''}</button>`).join('')}${blacks.map(m=>{const x=whites.filter(w=>w<m).length*60-19;return`<button class="black-key key" style="left:${x}px" data-midi="${m}" aria-label="琴键 ${noteName(m)}">${settings.showNoteNames?`<span class="note-name">${NOTE_NAMES[m%12]}</span>`:''}</button>`}).join('')}</div></div><div class="keyboard-tip">${settings.octaveRange===1?'也可使用 A W S E D F T G Y H U J K 键弹奏':'键盘可横向滚动；电脑键盘快捷键对应第一个八度'}</div>`}

    function bindTraining(){document.querySelector('[data-play-question]').onclick=()=>playSequence(state.targetNotes,true);document.querySelectorAll('[data-midi]').forEach(k=>k.onclick=()=>instrumentInput(+k.dataset.midi,k));document.querySelectorAll('[data-direction]').forEach(b=>b.onclick=()=>checkDirection(b.dataset.direction));const reveal=document.querySelector('[data-reveal]');if(reveal)reveal.onclick=revealAnswer;const del=document.querySelector('[data-delete]');if(del)del.onclick=()=>{if(state.userNotes.length>1)state.userNotes.pop();refreshMelodyUI()};const clear=document.querySelector('[data-clear]');if(clear)clear.onclick=()=>{state.userNotes=[state.targetNotes[0]];state.comparison=[];refreshMelodyUI()};const mine=document.querySelector('[data-play-answer]');if(mine)mine.onclick=()=>playSequence(state.userNotes,false);const submit=document.querySelector('[data-submit]');if(submit)submit.onclick=submitMelody}
    function instrumentInput(midi,key){playInstrumentNote(midi);key.classList.add('pressed');setTimeout(()=>key.classList.remove('pressed'),180);if(state.status==='correct'||state.status==='revealed')return;if(state.mode==='singleMatch')checkSingle(midi);else if(state.mode==='melodyRepeat'&&state.userNotes.length<settings.melodyLength){state.userNotes.push(midi);state.lastInput=midi;markInstrument(midi,'selected');refreshMelodyUI();if(+settings.melodyLength===2)setTimeout(submitMelody,160)}}
    function markInstrument(midi,cls){document.querySelectorAll(`[data-midi="${midi}"]`).forEach(k=>k.classList.add(cls))}
    function setFeedback(text,type='info'){const f=document.querySelector('#feedback');if(!f)return;f.className='feedback '+type;f.textContent=text}
    function checkSingle(midi){state.attempts++;state.totalAttempts++;updateLiveMeta();if(midi===state.targetNotes[0]){markInstrument(midi,'correct');completeQuestion('正确，你找到了相同的音。')}else{markInstrument(midi,'wrong-key');setTimeout(()=>document.querySelectorAll('.wrong-key').forEach(x=>x.classList.remove('wrong-key')),500);const msg=!settings.hintEnabled?'还没有找对，请继续尝试。':midi<state.targetNotes[0]?'这个音偏低，请尝试更高的音。':'这个音偏高，请尝试更低的音。';setFeedback(msg,'bad')}}
    function checkDirection(answer){if(state.status==='correct'||state.status==='revealed')return;state.attempts++;state.totalAttempts++;state.directionWrong++;updateLiveMeta();const correct=directionOf(state.targetNotes);if(answer===correct){const text={higher:'判断正确，第二个音更高。',lower:'判断正确，第二个音更低。',same:'判断正确，两个音相同。'}[correct];showDirectionVisual(correct);completeQuestion(text)}else{let msg='判断不正确，请再听一次。';if(state.directionWrong===2)msg='请重点比较第二个音相对于第一个音的方向。';if(state.directionWrong>=3){msg+=' 现在可以查看答案。';document.querySelector('[data-reveal]').classList.remove('hidden')}setFeedback(msg,'bad')}}
    function showDirectionVisual(dir){const v=document.querySelector('#directionVisual');if(!v)return;const offset=dir==='higher'?-28:dir==='lower'?28:0,tilt=dir==='higher'?-10:dir==='lower'?10:0;v.innerHTML=`<div class="visual-direction" style="--offset:${offset}px;--tilt:${tilt}deg"><i class="pitch-dot"></i><i class="pitch-dot second"></i></div>`}
    function refreshMelodyUI(){const area=document.querySelector('#answerArea'),actions=document.querySelector('#questionActions');area.innerHTML=renderAnswerArea();actions.innerHTML=renderQuestionActions();bindPartialActions();if(state.comparison.length)paintComparison()}
    function bindPartialActions(){const del=document.querySelector('[data-delete]');if(del)del.onclick=()=>{if(state.userNotes.length>1)state.userNotes.pop();state.comparison=[];refreshMelodyUI()};const clear=document.querySelector('[data-clear]');if(clear)clear.onclick=()=>{state.userNotes=[state.targetNotes[0]];state.comparison=[];refreshMelodyUI()};const mine=document.querySelector('[data-play-answer]');if(mine)mine.onclick=()=>playSequence(state.userNotes,false);const submit=document.querySelector('[data-submit]');if(submit)submit.onclick=submitMelody}
    function submitMelody(){if(state.userNotes.length<settings.melodyLength)return;state.attempts++;state.totalAttempts++;updateLiveMeta();state.comparison=state.targetNotes.map((n,i)=>state.userNotes[i]===n?'right':state.userNotes[i]>n?'high':'low');paintComparison();if(state.comparison.every(x=>x==='right')){state.targetNotes.forEach(n=>markInstrument(n,'correct'));completeQuestion('太好了，你按顺序弹出了整段旋律。')}else{setFeedback('还差一点：✓ 正确，↑ 偏高，↓ 偏低。可以修改后再次提交。','bad');document.querySelector('#questionActions').insertAdjacentHTML('beforeend','<button class="btn ghost" data-standard>播放标准旋律</button>');document.querySelector('[data-standard]').onclick=()=>playSequence(state.targetNotes,false)}}
    function paintComparison(){state.comparison.forEach((x,i)=>{const slot=document.querySelector(`[data-slot="${i}"]`);if(slot){slot.classList.remove('filled','right','wrong');slot.classList.add(x==='right'?'right':'wrong');slot.textContent=x==='right'?'✓':x==='high'?'↑':'↓'}})}
    function revealAnswer(){if(state.status==='correct'||state.status==='revealed')return;state.usedAnswerReveal=true;state.status='revealed';state.targetNotes.forEach(n=>markInstrument(n,'correct'));if(state.mode==='pitchDirection'){const d=directionOf(state.targetNotes);showDirectionVisual(d);setFeedback({higher:'答案：第二个音更高。',lower:'答案：第二个音更低。',same:'答案：两个音相同。'}[d],'info')}else{playSequence(state.targetNotes,false);setFeedback(`答案已经在乐器上标出：${settings.showNoteNames?state.targetNotes.map(noteName).join('、'):'请再听一次正确的声音。'}`,'info')}finishQuestionButtons()}
    function completeQuestion(text){state.status='correct';setFeedback(`${text} 尝试 ${state.attempts} 次，用时 ${elapsed()} 秒。`,'good');finishQuestionButtons();if(settings.autoNext)setTimeout(()=>{if(state.view==='training'&&(state.status==='correct'||state.status==='revealed'))nextQuestion()},1000)}
    function elapsed(){return Math.max(.1,(Date.now()-state.startTime)/1000).toFixed(1)}
    function finishQuestionButtons(){const seconds=(Date.now()-state.startTime)/1000;state.questionResults.push({correct:!state.usedAnswerReveal,revealed:state.usedAnswerReveal,attempts:state.attempts,replays:state.replayCount,time:seconds});document.querySelectorAll('.direction-btn').forEach(b=>b.disabled=true);document.querySelector('#questionActions').innerHTML=`${state.mode==='melodyRepeat'?'<button class="btn ghost" data-standard>播放标准旋律</button><button class="btn ghost" data-play-answer>播放我的答案</button>':''}<button class="btn primary" data-next>${state.currentQuestionIndex>=state.totalQuestions?'查看结果':'下一题'}</button>`;document.querySelector('[data-next]').onclick=nextQuestion;const std=document.querySelector('[data-standard]');if(std)std.onclick=()=>playSequence(state.targetNotes,false);const mine=document.querySelector('[data-play-answer]');if(mine)mine.onclick=()=>playSequence(state.userNotes,false)}
    function nextQuestion(){if(state.currentQuestionIndex>=state.totalQuestions)finishTraining();else createNewQuestion()}

    function finishTraining(){const qs=state.questionResults,correct=qs.filter(q=>q.correct).length,revealed=qs.filter(q=>q.revealed).length,avg=qs.reduce((s,q)=>s+q.time,0)/Math.max(1,qs.length),record={id:String(Date.now()),date:new Date().toISOString(),mode:state.mode,instrument:settings.instrument,difficulty:settings.difficulty,questionCount:state.totalQuestions,correctCount:correct,revealedCount:revealed,totalAttempts:state.totalAttempts,replayCount:state.totalReplays,averageTime:+avg.toFixed(1)};history=Array.isArray(history)?history:[];history.push(record);history=history.slice(-100);save(STORAGE.history,history);state.result=record;setView('results')}
    function evaluation(score){if(score>=90)return'非常好，你已经能够比较稳定地完成这一组训练。';if(score>=70)return'表现不错，可以继续巩固当前难度。';if(score>=50)return'你已经开始建立音高感觉，建议继续练习当前难度。';return'不必着急，可以降低难度，多使用高低提示。'}
    function renderResults(){const r=state.result,score=Math.round(r.correctCount/r.questionCount*100);el.main.innerHTML=`<section class="results"><div class="result-hero"><div class="score-ring" style="--score:${score}%"><strong>${score}%</strong></div><h1>这一组完成了</h1><p>${evaluation(score)}</p></div><div class="stat-grid"><div class="stat"><small>完成题数</small><strong>${r.questionCount}</strong></div><div class="stat"><small>独立答对</small><strong>${r.correctCount}</strong></div><div class="stat"><small>查看答案</small><strong>${r.revealedCount}</strong></div><div class="stat"><small>总尝试</small><strong>${r.totalAttempts}</strong></div><div class="stat"><small>总重播</small><strong>${r.replayCount}</strong></div><div class="stat"><small>平均用时</small><strong>${r.averageTime}<small> 秒</small></strong></div></div><div class="result-actions"><button class="btn primary" data-again>再练一组</button>${settings.difficulty>1?'<button class="btn ghost" data-level="down">降低难度</button>':''}${settings.difficulty<3?'<button class="btn ghost" data-level="up">提高难度</button>':''}<button class="btn ghost" data-home>返回首页</button></div></section>`;document.querySelector('[data-again]').onclick=startTraining;document.querySelector('[data-home]').onclick=()=>setView('home');document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{settings.difficulty+=b.dataset.level==='up'?1:-1;save(STORAGE.settings,settings);startTraining()})}
    function renderHistory(){const records=(Array.isArray(history)?history:[]).slice(-10).reverse();el.main.innerHTML=`<section class="history"><div class="page-title"><div><h1>训练记录</h1><p>最近 10 组训练，数据仅保存在此浏览器。</p></div>${records.length?'<button class="btn ghost danger" data-clear-history>清空记录</button>':''}</div>${records.length?`<div class="history-list"><div class="history-item header"><span>日期</span><span>模式</span><span>乐器</span><span>难度</span><span>正确率</span><span>平均用时</span></div>${records.map(r=>`<div class="history-item"><span>${new Date(r.date).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</span><span>${MODE_INFO[r.mode]?.name||r.mode}</span><span>${r.instrument==='piano'?'钢琴':'吉他'}</span><span>${DIFFICULTIES[r.difficulty]?.name||r.difficulty}</span><strong>${Math.round(r.correctCount/r.questionCount*100)}%</strong><span>${r.averageTime} 秒</span></div>`).join('')}</div>`:'<div class="empty">还没有训练记录。完成第一组练习后，这里会出现你的进步。</div>'}</section>`;const clear=document.querySelector('[data-clear-history]');if(clear)clear.onclick=()=>confirmModal('清空训练记录','确定清空全部训练记录吗？此操作无法撤销。',()=>{history=[];save(STORAGE.history,history);renderHistory()})}

    function openSettings(){const s=settings;el.modal.innerHTML=`<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><div class="modal-head"><h2 id="settingsTitle">训练设置</h2><button class="btn icon-btn" data-x aria-label="关闭">×</button></div><div class="modal-body"><div class="setting-group"><div class="setting-title">乐器类型</div>${radio('instrument',[['piano','钢琴'],['guitar','吉他']],s.instrument)}</div><div class="setting-group guitar-only ${s.instrument==='guitar'?'':'hidden'}"><div class="setting-title">吉他弦</div>${radio('guitarString',[[1,'第1弦'],[2,'第2弦'],[3,'第3弦']],s.guitarString)}</div><div class="setting-group"><div class="setting-title">音域范围</div>${radio('octaveRange',[[1,'一个八度'],[2,'两个八度']],s.octaveRange)}<div class="instrument-help" style="margin-top:7px">钢琴为 C4–C5 / C4–C6；吉他对应 12 / 24 个品位。</div></div><div class="setting-group"><div class="setting-title">每组题数</div>${radio('questionCount',[[5,'5题'],[10,'10题'],[20,'20题']],s.questionCount)}</div><div class="setting-group"><div class="setting-title">题目难度</div>${radio('difficulty',[[1,'入门 · 2音'],[2,'基础 · 3音'],[3,'进阶 · 5音']],s.difficulty)}</div><div class="setting-group"><div class="setting-title">播放速度</div>${radio('playbackSpeed',[['slow','慢'],['normal','正常']],s.playbackSpeed)}</div><div class="setting-group"><div class="setting-title">短旋律长度</div>${radio('melodyLength',[[2,'两个音'],[3,'三个音']],s.melodyLength)}</div><div class="setting-group"><div class="setting-title">辅助选项</div>${radio('hintEnabled',[[true,'开启高低提示'],[false,'关闭高低提示']],s.hintEnabled)}<div style="height:7px"></div>${radio('showNoteNames',[[false,'隐藏音名'],[true,'显示音名']],s.showNoteNames)}<div style="height:7px"></div>${radio('autoNext',[[false,'手动下一题'],[true,'答对后自动下一题']],s.autoNext)}</div><div class="setting-group"><label for="volume">音量 <span id="volumeValue">${Math.round(s.volume*100)}%</span></label><div class="range-row"><span>◖</span><input id="volume" name="volume" type="range" min="0" max="1" step=".05" value="${s.volume}"><span>◕</span></div></div><button class="btn primary" style="width:100%" data-save-settings>保存设置</button></div></section></div>`;const backdrop=el.modal.querySelector('.modal-backdrop');backdrop.onclick=e=>{if(e.target===backdrop)closeModal()};el.modal.querySelector('[data-x]').onclick=closeModal;el.modal.querySelectorAll('input[name="instrument"]').forEach(x=>x.onchange=()=>el.modal.querySelectorAll('.guitar-only').forEach(g=>g.classList.toggle('hidden',x.value!=='guitar')));el.modal.querySelector('#volume').oninput=e=>el.modal.querySelector('#volumeValue').textContent=Math.round(e.target.value*100)+'%';el.modal.querySelector('[data-save-settings]').onclick=saveSettingsFromModal;setTimeout(()=>el.modal.querySelector('[data-x]').focus(),0)}
    function radio(name,options,value){return`<div class="segmented">${options.map(([v,label])=>`<label><input type="radio" name="${name}" value="${v}" ${String(v)===String(value)?'checked':''}><span>${label}</span></label>`).join('')}</div>`}
    function saveSettingsFromModal(){const value=name=>el.modal.querySelector(`input[name="${name}"]:checked`)?.value;settings={instrument:value('instrument'),guitarString:+value('guitarString')||settings.guitarString,guitarMaxFret:settings.guitarMaxFret,octaveRange:+value('octaveRange')||1,questionCount:+value('questionCount'),difficulty:+value('difficulty'),playbackSpeed:value('playbackSpeed'),melodyLength:+value('melodyLength'),hintEnabled:value('hintEnabled')==='true',showNoteNames:value('showNoteNames')==='true',autoNext:value('autoNext')==='true',volume:+el.modal.querySelector('#volume').value};if(master)master.gain.value=settings.volume;save(STORAGE.settings,settings);closeModal();showNotice('设置已保存');if(state.view==='training'){state.currentQuestionIndex--;createNewQuestion()}else render()}
    function closeModal(){el.modal.innerHTML=''}
    function confirmModal(title,text,onConfirm){el.modal.innerHTML=`<div class="modal-backdrop"><section class="modal" style="max-width:430px" role="alertdialog" aria-modal="true"><div class="modal-body" style="padding:28px"><h2 style="margin-top:0">${title}</h2><p style="color:var(--muted)">${text}</p><div class="question-actions" style="justify-content:flex-end"><button class="btn ghost" data-cancel>取消</button><button class="btn danger" data-confirm>确定</button></div></div></section></div>`;el.modal.querySelector('[data-cancel]').onclick=closeModal;el.modal.querySelector('[data-confirm]').onclick=()=>{closeModal();onConfirm()}}
    function goHome(){if(state.view==='training'&&state.status!=='correct'&&state.status!=='revealed')confirmModal('退出本组训练？','本组训练尚未完成，确定退出吗？',()=>setView('home'));else setView('home')}

    document.querySelector('[data-action="settings"]').onclick=openSettings;document.querySelector('[data-action="history"]').onclick=()=>setView('history');document.querySelector('[data-action="home"]').onclick=goHome;
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&el.modal.innerHTML){closeModal();return}if(el.modal.innerHTML||state.view!=='training'||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();document.querySelector('[data-play-question]')?.click()}else if(e.key==='Enter'){e.preventDefault();(document.querySelector('[data-submit]:not(:disabled)')||document.querySelector('[data-next]'))?.click()}else if(e.key==='Backspace'){e.preventDefault();document.querySelector('[data-delete]:not(:disabled)')?.click()}else if(state.mode!=='pitchDirection'){const keys='AWSEDFTGYHUJK',i=keys.indexOf(e.key.toUpperCase());if(i>=0)document.querySelector(`[data-midi="${60+i}"]`)?.click()}});
    renderHome();
  })();
  </script>
</body>
</html>
