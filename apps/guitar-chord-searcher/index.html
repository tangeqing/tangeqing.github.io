<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>吉他和弦速查</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: { DEFAULT: '#0d1117', card: '#161b22', hover: '#1c2129', elevated: '#21262d' },
            border: { DEFAULT: '#30363d', light: '#484f58' },
            accent: { DEFAULT: '#f0c060', light: '#f7d78c', dark: '#c49b3c' },
            text: { primary: '#e6edf3', secondary: '#8b949e', muted: '#6e7681' },
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #0d1117; }
    .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0d1117; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #484f58; }
    .card-glow { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    .card-glow:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(240,192,96,0.08), 0 0 0 1px rgba(240,192,96,0.15); }
    .btn-filter { transition: all 0.15s ease; }
    .btn-filter:active { transform: scale(0.95); }
  </style>
</head>
<body class="bg-bg text-text-primary min-h-screen">
  <div id="root"></div>

  <script src="chords.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

  <script type="text/babel">
    const { useState, useMemo, useCallback } = React;

    // ─── Constants ──────────────────────────────────────────
    const ROOTS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    const ALL_NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    const STRING_LABELS = ['E','A','D','G','B','e'];
    const OPEN_NOTE_IDX = [4,9,2,7,11,4];
    const ALL_TYPES = ['Major','Minor','Diminished','maj7','m7','7','add9','9','sus2','sus4','6'];

    // ─── MiniFretboard (Vertical) ──────────────────────────
    // Sanitize chord name for use in SVG IDs (strip '#')
    function safeId(name) { return name.replace(/#/g, 's'); }

    function MiniFretboard({ chord, posIdx }) {
      if (!chord) return null;
      const pos = chord.positions[posIdx] || chord.positions[0];
      if (!pos) return null;

      const VW = 280, VH = 370;
      const NUT_Y = 72;
      const FRET_H = 52;
      const MARGIN = 30, SP = 28;
      const STR_X = [MARGIN, MARGIN+SP, MARGIN+2*SP, MARGIN+3*SP, MARGIN+4*SP, MARGIN+5*SP];
      const NUM_FRETS = 5;
      const baseFret = pos.base_fret;

      const dots = [];
      for (let s = 0; s < 6; s++) {
        const ch = pos.frets[s];
        const sx = STR_X[s];
        if (ch === 'x') {
          dots.push({ sx, y: NUT_Y - 30, isMuted: true, isOpen: false, isRoot: false, noteName: '', d: -1 });
        } else if (ch === '0') {
          const ni = OPEN_NOTE_IDX[s];
          dots.push({ sx, y: NUT_Y - 30, isMuted: false, isOpen: true, isRoot: pos.intervals && pos.intervals[s] === 0, noteName: ALL_NOTES[ni], d: 0 });
        } else {
          const d = parseInt(ch, 16);
          const absFret = d + baseFret - 1;
          const ni = (OPEN_NOTE_IDX[s] + absFret) % 12;
          const dotY = NUT_Y + (d - 0.5) * FRET_H;
          dots.push({ sx, y: dotY, isMuted: false, isOpen: false, isRoot: pos.intervals && pos.intervals[s] === 0, noteName: ALL_NOTES[ni], d });
        }
      }

      const fretNums = Array.from({length: NUM_FRETS}, (_, i) => baseFret + i);
      const rightEdge = STR_X[5] + SP;

      return (
        <svg viewBox={`0 0 ${VW} ${VH}`} className="w-full" style={{maxWidth: '280px'}}>
          <defs>
            <filter id={`glow-r-${safeId(chord.name)}`} x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="2.4" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <rect x={0} y={0} width={VW} height={VH} fill="#0d1117" rx={6} />

          {/* Fret markers */}
          {fretNums.map((fn, i) => {
            const cy = NUT_Y + (i + 0.5) * FRET_H;
            if (fn === 3 || fn === 5 || fn === 7 || fn === 9) {
              return <circle key={`mk${fn}`} cx={STR_X[2] + 14} cy={cy} r={5} fill="#2a2f3a" />;
            }
            if (fn === 12) {
              return (<g key={`mk${fn}`}>
                <circle cx={STR_X[1] + 14} cy={cy} r={5} fill="#2a2f3a" />
                <circle cx={STR_X[4] + 14} cy={cy} r={5} fill="#2a2f3a" />
              </g>);
            }
            return null;
          })}

          {/* Fret lines */}
          {Array.from({length: NUM_FRETS + 1}, (_, i) => (
            <line key={`fl${i}`} x1={STR_X[0] - 12} y1={NUT_Y + i * FRET_H} x2={STR_X[5] + 12} y2={NUT_Y + i * FRET_H}
              stroke={i === 0 ? '#c0a060' : '#3a3f47'} strokeWidth={i === 0 ? 4 : 2} />
          ))}

          {/* Strings */}
          {STR_X.map((sx, i) => (
            <line key={`str${i}`} x1={sx} y1={NUT_Y} x2={sx} y2={NUT_Y + NUM_FRETS * FRET_H}
              stroke={i < 3 ? '#a08050' : '#8b8b8b'} strokeWidth={2.8 - i * 0.15} />
          ))}

          {/* String labels */}
          {STR_X.map((sx, i) => (
            <text key={`sl${i}`} x={sx} y={NUT_Y - 36} textAnchor="middle" fill="#6e7681" fontSize="14" fontWeight="600" className="mono">
              {STRING_LABELS[i]}
            </text>
          ))}

          {/* Fret number labels */}
          {fretNums.map((fn, i) => (
            <text key={`fn${i}`} x={rightEdge + 8} y={NUT_Y + (i + 0.5) * FRET_H + 5} textAnchor="start" fill="#484f58" fontSize="12" className="mono">
              {fn}
            </text>
          ))}

          {/* Dots */}
          {dots.map((dot, i) => {
            if (dot.isMuted) {
              return <text key={`d${i}`} x={dot.sx} y={dot.y + 7} textAnchor="middle" fill="#6e7681" fontSize="22" fontWeight="bold">{'\u2715'}</text>;
            }
            if (dot.isOpen) {
              return (
                <g key={`d${i}`}>
                  <circle cx={dot.sx} cy={dot.y} r={12} fill="none" stroke={dot.isRoot ? '#f85149' : '#3fb950'} strokeWidth={2.5} />
                  <text x={dot.sx} y={dot.y + 5} textAnchor="middle" fill={dot.isRoot ? '#f85149' : '#3fb950'} fontSize="11" fontWeight="700" className="mono">{dot.noteName}</text>
                </g>
              );
            }
            return (
              <g key={`d${i}`}>
                <circle cx={dot.sx} cy={dot.y} r={14}
                  fill={dot.isRoot ? '#f85149' : '#58a6ff'}
                  stroke={dot.isRoot ? '#ff7b72' : '#79c0ff'}
                  strokeWidth={2}
                  filter={dot.isRoot ? `url(#glow-r-${safeId(chord.name)})` : undefined} />
                <text x={dot.sx} y={dot.y + 5} textAnchor="middle" fill="#fff" fontSize="11" fontWeight="700" className="mono">{dot.noteName}</text>
              </g>
            );
          })}
        </svg>
      );
    }

    // ─── ChordCard ──────────────────────────────────────────
    function ChordCard({ chord, posIdx }) {
      const hasPositions = chord.positions && chord.positions.length > 0;
      const pos = hasPositions ? chord.positions[posIdx || 0] : null;
      const cagedLabel = pos ? pos.caged_shape : '';

      return (
        <div className="card-glow bg-bg-card rounded-xl border border-border p-4 flex flex-col items-center gap-3 select-none">
          {/* Fretboard */}
          {hasPositions ? (
            <div className="rounded-lg overflow-hidden">
              <MiniFretboard chord={chord} posIdx={posIdx || 0} />
            </div>
          ) : (
            <div className="flex items-center justify-center rounded-lg bg-bg-elevated/50 border border-border/50"
              style={{width: '280px', height: '336px'}}>
              <span className="text-text-muted/40 text-sm mono text-center leading-relaxed">暂无<br/>指法</span>
            </div>
          )}

          {/* Name + CAGED */}
          <div className="text-center w-full">
            <h3 className="text-base font-bold text-accent tracking-tight mono leading-tight">{chord.name}</h3>
            {cagedLabel && (
              <span className="inline-block text-[11px] px-2.5 py-0.5 rounded-full bg-bg-elevated text-text-muted font-medium mt-1 mono">{cagedLabel}</span>
            )}
          </div>

          {/* Notes */}
          <div className="flex flex-wrap justify-center gap-1">
            {chord.notes.map((note, i) => (
              <span key={i} className={`inline-flex items-center justify-center w-6 h-6 rounded-full text-[11px] font-bold mono
                ${note === chord.root
                  ? 'bg-red-500/15 text-red-400 ring-1 ring-red-500/25'
                  : 'bg-white/5 text-text-secondary'}`}>
                {note}
              </span>
            ))}
          </div>
        </div>
      );
    }

    // ─── FilterBar ──────────────────────────────────────────
    function FilterBar({ selectedRoot, selectedType, onRootChange, onTypeChange, totalResults }) {
      return (
        <div className="bg-bg-card border-b border-border px-4 md:px-6 py-3 space-y-3 sticky top-0 z-10 backdrop-blur-sm bg-bg-card/95">
          {/* Root row */}
          <div className="flex items-center gap-2 flex-wrap">
            <span className="text-[11px] text-text-muted font-medium w-7 shrink-0">根音</span>
            <button onClick={() => onRootChange(null)}
              className={`btn-filter px-2.5 py-1 text-[11px] rounded-full font-medium mono
                ${!selectedRoot ? 'bg-accent text-gray-900 shadow-sm' : 'bg-bg-elevated text-text-secondary hover:bg-border hover:text-text-primary'}`}>
              全部
            </button>
            {ROOTS.map(root => (
              <button key={root} onClick={() => onRootChange(selectedRoot === root ? null : root)}
                className={`btn-filter px-2.5 py-1 text-[11px] rounded-full font-medium mono min-w-[32px]
                  ${selectedRoot === root ? 'bg-accent text-gray-900 shadow-sm' : 'bg-bg-elevated text-text-secondary hover:bg-border hover:text-text-primary'}`}>
                {root}
              </button>
            ))}
          </div>

          {/* Type row */}
          <div className="flex items-start gap-2 flex-wrap">
            <span className="text-[11px] text-text-muted font-medium w-7 shrink-0 mt-0.5">类型</span>
            <div className="flex flex-wrap gap-1.5">
              {ALL_TYPES.map(type => (
                <button key={type} onClick={() => onTypeChange(selectedType === type ? null : type)}
                  className={`btn-filter px-2.5 py-1 text-[11px] rounded-full font-medium mono
                    ${selectedType === type ? 'bg-blue-600 text-white shadow-sm' : 'bg-bg-elevated text-text-secondary hover:bg-border hover:text-text-primary'}`}>
                  {type}
                </button>
              ))}
            </div>
            {(selectedRoot || selectedType) && (
              <button onClick={() => { onRootChange(null); onTypeChange(null); }}
                className="text-[10px] text-text-muted hover:text-accent underline underline-offset-2 ml-2 mt-0.5">清除</button>
            )}
          </div>

          {/* Count */}
          <div className="text-[11px] text-text-muted">
            共 <span className="text-accent font-semibold mono text-sm">{totalResults}</span> 个和弦
          </div>
        </div>
      );
    }

    // ─── EmptyState ─────────────────────────────────────────
    function EmptyState() {
      return (
        <div className="flex-1 flex items-center justify-center py-24">
          <div className="text-center space-y-4">
            <div className="text-6xl text-text-muted/20">{'\u266B'}</div>
            <p className="text-text-secondary text-base font-medium">没有匹配的和弦</p>
            <p className="text-text-muted/50 text-sm">尝试调整筛选条件，或点击"清除"查看全部和弦</p>
            <div className="flex justify-center gap-2 pt-2">
              {['C','D','E','G','A'].map(r => (
                <span key={r} className="inline-flex items-center justify-center w-8 h-8 rounded-full bg-bg-elevated text-text-muted text-xs mono">{r}</span>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─── App ─────────────────────────────────────────────────
    function App() {
      const chords = window.CHORDS_DATA || [];
      const [selectedRoot, setSelectedRoot] = useState(null);
      const [selectedType, setSelectedType] = useState(null);

      const flatCards = useMemo(() => {
        const result = [];
        const filtered = chords.filter(c => {
          if (selectedRoot && c.root !== selectedRoot) return false;
          if (selectedType && c.type !== selectedType) return false;
          return true;
        });
        for (const chord of filtered) {
          const nPos = (chord.positions && chord.positions.length > 0) ? chord.positions.length : 1;
          for (let i = 0; i < nPos; i++) {
            result.push({ chord, posIdx: i });
          }
        }
        return result;
      }, [chords, selectedRoot, selectedType]);

      const handleRootChange = useCallback((root) => setSelectedRoot(root), []);
      const handleTypeChange = useCallback((type) => setSelectedType(type), []);

      return (
        <div className="min-h-screen bg-bg text-text-primary flex flex-col">
          {/* Header */}
          <header className="bg-bg-card border-b border-border px-6 py-3.5 flex items-center gap-3">
            <div className="w-0.5 h-7 rounded-full bg-accent" />
            <div>
              <h1 className="text-lg font-bold tracking-tight">
                <span className="text-accent">吉他</span>
                <span className="text-text-primary">和弦速查</span>
              </h1>
              <p className="text-text-muted text-[11px]">Guitar Chord System Trainer</p>
            </div>
          </header>

          {/* Filter Bar */}
          <FilterBar
            selectedRoot={selectedRoot}
            selectedType={selectedType}
            onRootChange={handleRootChange}
            onTypeChange={handleTypeChange}
            totalResults={flatCards.length}
          />

          {/* Grid */}
          <div className="flex-1 p-3 md:p-5 overflow-auto">
            {flatCards.length > 0 ? (
              <div className="grid grid-cols-4 gap-4">
                {flatCards.map((item, idx) => (
                  <ChordCard key={`${item.chord.name}-${item.posIdx}`} chord={item.chord} posIdx={item.posIdx} />
                ))}
              </div>
            ) : (
              <EmptyState />
            )}
          </div>

          {/* Footer */}
          <footer className="bg-bg-card border-t border-border px-6 py-2.5 text-center">
            <p className="text-[10px] text-text-muted/40">
              132 个和弦 · CAGED 体系全标注 · 全部指法直接展示
            </p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
